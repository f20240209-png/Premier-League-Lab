# Creates PAID resources. Review Render's quoted price before approving.
# No scheduled imports or external AI spending enabled by this blueprint.
services:
  - type: web
    name: premier-league-lab
    runtime: python
    plan: 1c-2g
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py init
    startCommand: gunicorn --config gunicorn.conf.py 'app:create_app()'
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: football-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: football-limiter
          type: keyvalue
          property: connectionString
      - key: ADMIN_PASSWORD_HASH
        sync: false
  - type: keyvalue
    name: football-limiter
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
databases:
  - name: football-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: '17'
    region: singapore
    ipAllowList: []
